syntax = "proto3";

package spark.agent.v1;

option go_package = "spark-cloud/internal/agentpb;agentpb";

// AgentGateway 是平台侧网关：Enroll 不需要客户端证书（一次性令牌 + CSR），Connect 必须 mTLS。
service AgentGateway {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Connect(stream AgentMessage) returns (stream PlatformMessage);
}

message EnrollRequest {
  string token = 1;    // spk1_<令牌>
  bytes csr_der = 2;   // PKCS#10 DER，平台只取其公钥
}

message EnrollResponse {
  bytes cert_der = 1;  // 机器证书 DER（CN = 序列号）
  bytes ca_der = 2;    // 根 CA 证书 DER
}

message AgentMessage {
  oneof msg {
    Hello hello = 1;          // 建流后第一条
    StateReport state = 2;    // 建流后第二条，此后每 60 秒一次，以及每条指令执行完后
    Heartbeat heartbeat = 3;  // 每 10 秒
    CommandResult result = 4;
  }
}

message PlatformMessage {
  oneof msg {
    Command command = 1;
    AgentConfig config = 2;   // 建流后平台发的第一条
  }
}

message Hello {
  string agent_version = 1;
  string hostname = 2;
  repeated string ips = 3;    // 本机全部 IPv4 地址
  // 能力位图（internal/agent/features）：bit0 = 支持 CreateInstance.share_slots。计划 10 新增，旧 Agent 为 0；平台目前不读取（共享机已搁置）。
  uint32 features = 4;
  // 网卡探测（计划 13）：建流时一次，此后随每份 StateReport；旧 Agent 不发。
  NetInfo net = 5;
}

message AgentConfig {
  string lan_ip = 1;                 // machines.lan_ip，容器 SSH 端口发布到该地址
  uint32 heartbeat_interval_s = 2;
  repeated string allow_cidrs = 3;   // 内网白名单
  repeated string dns_servers = 4;
  uint32 bandwidth_mbps = 5;         // 默认限速
  uint32 data_size_gib = 6;          // 数据盘大小
}

message Command {
  string id = 1;           // agent_commands.id
  string instance_id = 2;  // pull_image 为空
  oneof body {
    CreateInstance create = 10;
    StartInstance start = 11;
    StopInstance stop = 12;
    WipeInstance wipe = 13;
    PullImage pull = 14;
    ConfigureCluster configure_cluster = 15;   // 计划 13：成员变更后推给集群全部成员
  }
}

message CreateInstance {
  string image_ref = 1;
  string upstream_pubkey = 2;   // authorized_keys 一行
  uint32 bandwidth_mbps = 3;
  uint32 ssh_port = 4;          // 容器 22 发布到 <lan_ip>:<ssh_port>
  uint32 data_size_gib = 5;
  // 平台生成的容器 sshd 主机私钥（OpenSSH PEM）。敏感：只在 mTLS 流上传输，不落日志，不进 agent_commands.payload；
  // 为空时 Agent 沿用本地生成（兼容旧平台）。
  string host_key_pem = 6;
  // 份数：0 / 1 = 整机；2 / 4 = 按份等分内存、CPU、数据盘（Agent 侧计算）。计划 10 新增，旧 Agent 忽略。
  uint32 share_slots = 7;
  // 计划 13：非空 = 集群成员（create 时决定 RDMA 设备与 cap-drop NET_RAW）。旧 Agent 会静默忽略，平台按 features bit1 门控。
  ClusterSpec cluster = 8;
}
message StartInstance {}
message StopInstance {}
message WipeInstance {}
message PullImage { string image_ref = 1; }

// ConfigureCluster：按 version 取新（小于本地 version 的忽略）；cluster.cluster_id 为空 = 退出集群（清理网络与文件）。
message ConfigureCluster { ClusterSpec cluster = 1; }

// ClusterSpec 与 internal/clusterspec.Spec 一一对应（规格 §4.1）。
message ClusterSpec {
  string cluster_id = 1;
  uint32 version = 2;
  uint32 size = 3;
  uint32 rank = 4;
  string mode = 5;          // routed / macvlan
  string iface = 6;         // 宿主机集群网卡（routed 出口 / macvlan 父接口）
  uint32 vlan = 7;          // 0 = 不打标签
  uint32 mtu = 8;           // 0 = 继承
  string subnet = 9;        // 10.210.C.0/24
  bool rdma = 10;
  repeated ClusterMember members = 11;   // 含自己，按 rank
}
message ClusterMember {
  uint32 rank = 1;
  string instance_id = 2;
  string ip = 3;
  string host_ip = 4;       // 只在 routed 有
}

// NetInfo / NetIface 与 internal/clusterspec.NetInfo / Iface 一一对应（规格 §3.2）。
message NetInfo {
  string lan_iface = 1;   // 仅供参考：持有 AgentConfig.lan_ip 的网卡；收到 AgentConfig 之前为空，平台按 machines.lan_ip 认管理网卡
  repeated NetIface ifaces = 2;
}
message NetIface {
  string name = 1;
  string mac = 2;
  bool up = 3;
  int32 speed_mbps = 4;
  uint32 mtu = 5;
  repeated string ipv4 = 6;   // CIDR，如 192.168.1.221/24
  string driver = 7;
  string pci = 8;
  bool wireless = 9;
  string rdma_device = 10;
  bool rdma_active = 11;
  string uverbs = 12;
  string link_layer = 13;
}

message CommandResult {
  string command_id = 1;
  bool ok = 2;
  string message = 3;   // 失败原因：命令 + stderr 末尾 500 字节
}

message StateReport {
  repeated InstanceState instances = 1;
  // 已缓存镜像的 repository:tag 列表（docker image ls，≤ 200 项）；计划 7 新增，旧 Agent 不发该字段，平台不覆盖已有记录。
  repeated string images = 2;
  // 网卡探测（计划 13，链路变化可见）；旧 Agent 不发，平台不覆盖已有记录。
  NetInfo net = 3;
}

message InstanceState {
  string instance_id = 1;
  string phase = 2;   // running / stopped / missing_data / unknown
  string cluster = 3; // 计划 13：集群网络状态 "" 非集群 / "ok" / "pending"（容器未运行）/ "error: <原因>"
}

message Heartbeat {
  Metrics metrics = 1;
  // 每个实例的 cgroup 用量（计划 10 新增；旧 Agent 不发）。
  repeated InstanceMetrics instances = 2;
}

// InstanceMetrics：各数值字段 0 表示「未知 / 采不到」，不代表真实用量为 0。例如 Agent 刚重启、
// 容器 cgroup 目录尚未解析时内存 / CPU 为 0；CPU 首个样本为 0；数据盘未挂载（目录不是挂载点）时 data_disk_used 为 0。
message InstanceMetrics {
  string instance_id = 1;
  uint64 mem_current = 2;     // 容器 cgroup memory.current（字节）
  uint64 mem_max = 3;         // 容器 cgroup memory.max（字节；不限为 0）
  double cpu_percent = 4;     // 两次采样间 CPU 使用率（100 = 一个核满载）
  uint64 data_disk_used = 5;  // 实例数据盘已用字节
}

message Metrics {
  double gpu_util = 1;
  double gpu_temp_c = 2;
  double gpu_power_w = 3;
  uint64 mem_total = 4;
  uint64 mem_used = 5;
  uint64 root_disk_total = 6;
  uint64 root_disk_used = 7;
  uint64 data_disk_used = 8;
  double load1 = 9;
}
